name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Identite git pour les tests
        run: |
          git config --global user.name ci
          git config --global user.email "ci@users.noreply.github.com"
      - name: Syntaxe des scripts
        run: for f in install.sh bin/* shell/atelier.sh; do bash -n "$f"; done
      - name: Moteur d'equipe
        run: python3 -B -m unittest discover -s team -p 'test_*.py'
      - name: Hooks et installeur
        run: python3 -B -m unittest discover -s tests
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning -s bash install.sh bin/* shell/atelier.sh
